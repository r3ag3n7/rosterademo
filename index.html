function career(){return `${header('career','Планируйте следующий шаг и развивайте навыки в своём темпе.')}<div class="grid two">${card(`<h2>Мой маршрут</h2><div class="list">${jobs.map((j,i)=>`<div class="item"><div class="icon">${['✓','↗','◎','◇'][i]}</div><div class="item-main"><strong>${j.name}</strong><small>${i===0?'Текущая должность':i===1?'Следующий шаг':'Перспектива развития'}</small><div class="bar"><span style="width:${j.ready}%"></span></div></div><span class="tag ${j.ready<30?'gold':''}">${j.ready}%</span></div>`).join('')}</div>`)}${card(`<h2>${t('mySkills')}</h2><div class="list">${[['Охрана труда',true],['Работа с оборудованием',true],['Контроль качества',false],['Обучение коллег',false]].map(([s,ok])=>`<div class="item"><div class="icon">${ok?'✓':'○'}</div><div class="item-main"><strong>${s}</strong><small>${ok?'Подтверждён':'Нужно развить'}</small></div><span class="tag ${ok?'':'gold'}">${ok?'Готово':'В плане'}</span></div>`).join('')}</div>`)}</div><div class="section">${card(`<div class="row"><h2>${t('openRole')}</h2><span class="tag">2 вакансии</span></div><div class="list"><div class="item"><div class="icon">⚙</div><div class="item-main"><strong>Старший оператор — Плавильный цех</strong><small>Полная смена · совпадение навыков 75%</small></div><button class="btn outline small" data-action="interest">Подробнее</button></div><div class="item"><div class="icon">⌁</div><div class="item-main"><strong>Техник оборудования — Механический цех</strong><small>Сменный график · совпадение навыков 48%</small></div><button class="btn outline small" data-action="interest">Подробнее</button></div></div>`)}</div>`}
function learning(){let shown=courses.filter(c=>(filter==='all'||(filter==='done'?store.completed.includes(c.id)||c.status==='done':c.status==='assigned'))&&(!query||c.title.toLowerCase().includes(query.toLowerCase())));return `${header('learning','Материалы и короткие тесты для развития профессиональных навыков.')}<div class="tabs">${['all','assigned','done'].map(k=>`<button class="${filter===k?'active':''}" data-filter="${k}">${t(k)}</button>`).join('')}</div>${card(`<input class="search" id="course-search" placeholder="${t('search')}" value="${esc(query)}"><div class="list">${shown.length?shown.map(courseCard).join(''):`<div class="empty">Материалы не найдены</div>`}</div>`)}<div class="section">${card(`<div class="row"><div><h3>Материал от экспертов</h3><p>Короткие заметки помогают передать практический опыт команды.</p></div><span class="tag">База знаний</span></div>`)}</div>`}
function mentorship(){return `${header('mentor','Договоритесь о следующем шаге и фиксируйте договорённости после встречи.')}<div class="grid two">${card(`<div class="row"><div><div class="eyebrow">Мой наставник</div><h2 style="margin-top:6px">Давид Григорян</h2><p>Мастер смены · Плавильный цех</p></div><div class="avatar">ДГ</div></div><div class="notice" style="margin-top:16px">Следующая встреча: 21 ноября, 14:00</div><button class="btn" data-action="meeting" style="margin-top:14px">${t('bookMeeting')}</button>`)}${card(`<div class="row"><h2>${t('goals')}</h2><button class="btn outline small" data-action="goal">${t('addGoal')}</button></div><div class="list">${(store.goals.length?store.goals:[{title:'Освоить настройку линии',desc:'Практика с наставником',status:'В работе'},{title:'Провести разбор качества',desc:'До конца ноября',status:'В работе'}]).map(g=>`<div class="item"><div class="icon">◎</div><div class="item-main"><strong>${esc(g.title)}</strong><small>${esc(g.desc)}</small></div><span class="tag gold">${esc(g.status||'В работе')}</span></div>`).join('')}</div>` )}</div><div class="section">${card(`<div class="row"><h2>${t('meetingLog')}</h2><button class="btn outline small" data-action="meeting">${t('record')}</button></div><div class="list">${(store.meetings.length?store.meetings:[{date:'14 ноября',goal:'План развития на месяц',notes:'Согласовали практику и повторную встречу.'}]).map(m=>`<div class="item"><div class="icon">☷</div><div class="item-main"><strong>${esc(m.goal)}</strong><small>${esc(m.date)} · ${esc(m.notes)}</small></div><span class="tag">Записано</span></div>`).join('')}</div>`)}</div>`}
function contribution(){return `${header('contribution','Признание за обучение, помощь коллегам и полезные предложения.')}<section class="hero"><div><div class="eyebrow">${t('pointsTitle')}</div><h2>220 ${t('points')}</h2><p>Ваш вклад помогает команде расти.</p></div><div style="font-size:54px;text-align:center">✦</div></section><div class="grid two section">${card(`<h2>${t('badges')}</h2><div class="grid three"><div class="notice">🏅<br>Первый шаг</div><div class="notice">🌱<br>Учусь каждый день</div><div class="notice">🤝<br>Командный игрок</div></div>`)}${card(`<h2>За что начисляются баллы</h2><div class="list"><div class="item"><span>Завершение курса</span><span class="tag">+20</span></div><div class="item"><span>Встреча с наставником</span><span class="tag">+15</span></div><div class="item"><span>Предложение улучшения</span><span class="tag">+25</span></div><div class="item"><span>Помощь коллеге</span><span class="tag">+10</span></div></div>`)}</div><div class="section">${card(`<h2>${t('recognition')}</h2><div class="list"><div class="item"><div class="avatar">МК</div><div class="item-main"><strong>Мариам помогла команде смены</strong><small>Плавильный цех · сегодня</small></div><span class="tag">🤝 Команда</span></div><div class="item"><div class="avatar">АГ</div><div class="item-main"><strong>Арман завершил курс по качеству</strong><small>Контроль качества · вчера</small></div><span class="tag">📚 Обучение</span></div></div>`)}</div>`}
function ideas(){return `${header('ideas','Поделитесь идеей по безопасности, качеству или организации работы.')}<div class="row"><h2>Обратная связь команды</h2><button class="btn" data-action="idea">${t('newIdea')}</button></div>${card(`<div class="list">${(store.ideas.length?store.ideas:[{title:'Добавить маркировку для набора инструментов',status:'На рассмотрении',desc:'Сократит время поиска между сменами.'},{title:'Памятка по настройке оборудования',status:'Принято',desc:'Разместить короткую инструкцию у рабочего места.'}]).map(i=>`<div class="item"><div class="icon">♡</div><div class="item-main"><strong>${esc(i.title)}</strong><small>${esc(i.desc)}</small></div><span class="tag ${i.status==='Принято'?'':'gold'}">${esc(i.status)}</span></div>`).join('')}</div>`)}`}
function hr(){let doneCount=23+store.completed.length;return `${header('hr','Сводные показатели Rostera. Данные сотрудников полностью синтетические.')}<div class="grid three">${card(`<div class="metric">60</div><div class="metric-label">${t('employees')} · 3 цеха</div>`)}${card(`<div class="metric">${Math.min(100,Math.round(doneCount/60*100))}%</div><div class="metric-label">${t('trainingRate')}</div>`)}${card(`<div class="metric">12</div><div class="metric-label">${t('readyPool')} · готовность ≥ 70%</div>`)}</div><div class="grid two section">${card(`<div class="row"><h2>${t('engagement')}</h2><span class="tag">+8% за месяц</span></div><div class="metric">78%</div><div class="statline"><span>Обучение</span><div class="bar"><span style="width:68%"></span></div><b>68%</b></div><div class="statline" style="margin-top:12px"><span>Цели развития</span><div class="bar"><span style="width:74%"></span></div><b>74%</b></div><div class="statline" style="margin-top:12px"><span>Наставничество</span><div class="bar"><span style="width:81%"></span></div><b>81%</b></div>`)}${card(`<div class="row"><h2>Экспорт данных</h2><span class="tag">CSV</span></div><p>События исследования и ответы на опрос доступны для анализа.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn outline small" data-export="events">События</button><button class="btn outline small" data-export="survey">Опросы</button><button class="btn small" data-export="people">Сотрудники</button></div>`)}</div><div class="section">${card(`<div class="row"><h2>${t('employees')}</h2><span class="tag">3 цеха · 5 семейств должностей</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Сотрудник</th><th>${t('crew')}</th><th>${t('roleLabel')}</th><th>${t('readiness')}</th></tr></thead><tbody>${seedPeople.slice(0,10).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.crew}</td><td>${p.job}</td><td>${p.ready}%</td></tr>`).join('')}</tbody></table></div><p style="font-size:12px">Показаны 10 из 60 синтетических профилей.</p>`)}</div>`}
function survey(){let qs=['Мне было бы легко часто пользоваться этой системой.','Система кажется сложной без необходимости.','Системой было легко пользоваться.','Мне нужна помощь технического специалиста.','Функции системы хорошо связаны между собой.','В системе слишком много несогласованности.','Большинство людей быстро освоят систему.','С системой неудобно работать.','Я чувствовал(а) уверенность при работе с системой.','Мне пришлось изучить много нового перед началом работы.'];return `${header('feedback','Ответы анонимны в демо-версии и экспортируются из панели HR.')}<form id="survey-form">${card(`<h2>${t('sus')}</h2>${qs.map((q,i)=>`<div class="question"><label>${i+1}. ${q}</label><div class="scale">${[1,2,3,4,5].map(n=>`<label>${n}<input type="radio" name="q${i+1}" value="${n}" required></label>`).join('')}</div></div>`).join('')}`)}<div class="section">${card(`<h2>${t('nps')}</h2><div class="scale">${Array.from({length:11},(_,n)=>`<label>${n}<input type="radio" name="nps" value="${n}" required></label>`).join('')}</div><div class="row" style="margin-top:8px;color:var(--muted);font-size:12px"><span>Совсем маловероятно</span><span>Очень вероятно</span></div><button class="btn" style="margin-top:18px">${t('send')}</button>`)}</div></form>`}
function animatePage(){const root=document.querySelector('#content .page');if(!root)return;root.querySelectorAll('.card').forEach((el,i)=>el.style.setProperty('--card-delay',`${Math.min(i*65,520)}ms`));root.querySelectorAll('.bar span').forEach(el=>{const target=el.style.width||'100%';el.style.setProperty('width','0%','important');requestAnimationFrame(()=>el.style.setProperty('width',target,'important'))});const counters=[];const heading=root.querySelector('.hero h2');if(heading){const match=heading.textContent.match(/(\d+)%/);if(match){const value=Number(match[1]);heading.innerHTML=heading.textContent.replace(/\d+%/,`<span data-count-to="${value}">0%</span>`);counters.push(heading.querySelector('[data-count-to]'))}}const ring=root.querySelector('.progress-ring');if(ring){const value=63;ring.style.setProperty('--progress','0%');const label=ring.querySelector('strong');label.dataset.countTo=String(value);label.textContent='0%';counters.push(label);requestAnimationFrame(()=>ring.style.setProperty('--progress',`${value}%`))}const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;counters.forEach(el=>{const target=Number(el.dataset.countTo);if(reduce){el.textContent=`${target}%`;return}const start=performance.now(),duration=1350;function tick(now){const progress=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-progress,4);el.textContent=`${Math.round(target*eased)}%`;if(progress<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)})}const renderers={overview,career,learning,mentorship,contribution,ideas,hr,survey};function render(){document.documentElement.lang=lang;document.querySelector('#role').value=role;document.querySelector('#lang').value=lang;renderNav();document.querySelector('#content').innerHTML=`<div class="page active">${(renderers[page]||overview)()}</div>`;bind();requestAnimationFrame(animatePage)}
function go(p){if(p==='career'||p==='navigator')p='career';if(p==='career')event('navigator_opened');page=p;screenStartedAt=performance.now();render()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});let search=document.querySelector('#course-search');if(search)search.oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;render();let n=document.querySelector('#course-search');n.focus();n.setSelectionRange(pos,pos)};document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{let id=b.dataset.course;if(!store.completed.includes(id)){store.completed.push(id);event('material_completed',{material_id:id});toast(t('doneToast'))}render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>openForm(b.dataset.action));document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportCSV(b.dataset.export));let sf=document.querySelector('#survey-form');if(sf)sf.onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(sf));store.surveys||=[];store.surveys.push({at:new Date().toISOString(),...data});event('survey_submitted',{nps:Number(data.nps)});save();toast(t('surveyToast'));sf.reset()}}
function openForm(kind){let body=document.querySelector('#modal-body');let fields=kind==='goal'?`<div class="field"><label>${t('goalTitle')}</label><input name="title" required></div><div class="field"><label>${t('goalDesc')}</label><textarea name="desc" required></textarea></div>`:kind==='meeting'?`<div class="field"><label>${t('meetingDate')}</label><input name="date" type="date" required value="2026-11-21"></div><div class="field"><label>${t('goal')}</label><input name="goal" required></div><div class="field"><label>${t('meetingNotes')}</label><textarea name="notes" required></textarea></div>`:`<div class="field"><label>${t('ideaTitle')}</label><input name="title" required></div><div class="field"><label>${t('ideaDesc')}</label><textarea name="desc" required></textarea></div>`;body.innerHTML=`<form class="form" id="action-form"><div class="row"><h2>${kind==='goal'?t('createGoal'):kind==='meeting'?t('record'):t('newIdea')}</h2><button type="button" class="btn outline small" id="close-modal">×</button></div>${fields}<div class="row"><button type="button" class="btn outline" id="cancel-modal">${t('cancel')}</button><button class="btn">${kind==='goal'?t('save'):kind==='meeting'?t('record'):t('submit')}</button></div></form>`;document.querySelector('#modal').showModal();document.querySelectorAll('#close-modal,#cancel-modal').forEach(x=>x.onclick=()=>document.querySelector('#modal').close());document.querySelector('#action-form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.currentTarget));if(kind==='goal'){store.goals.unshift({...d,status:'В работе'});event('goal_created');toast(t('goalToast'))}else if(kind==='meeting'){store.meetings.unshift(d);event('meeting_logged');toast(t('meetingToast'))}else{store.ideas.unshift({...d,status:'Открыта'});event('suggestion_submitted');toast(t('ideaToast'))}save();document.querySelector('#modal').close();render()}}
function exportCSV(kind){let rows=kind==='events'?store.events:kind==='survey'?(store.surveys||[]):seedPeople;let keys=kind==='people'?['id','name','crew','job','ready']:rows.length?Object.keys(rows[0]):['event','at','user_id','company_id'];let csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=`rostera-${kind}.csv`;a.click();URL.revokeObjectURL(a.href)}
function openMobileMenu(){const body=document.querySelector('#mobile-nav-body');body.innerHTML=`<div class="row"><h2>Разделы</h2><button type="button" class="btn outline small" id="close-mobile-nav">×</button></div><div class="mobile-nav-list">${navKeys.slice(4).map((key,index)=>`<button type="button" class="btn outline" data-mobile-page="${key}"><i>${navIcons[index+4]}</i>${t('nav')[index+4]}</button>`).join('')}</div>`;const dialog=document.querySelector('#mobile-nav-dialog');dialog.showModal();document.querySelector('#close-mobile-nav').onclick=()=>dialog.close();body.querySelectorAll('[data-mobile-page]').forEach(button=>button.onclick=()=>{dialog.close();go(button.dataset.mobilePage);window.scrollTo({top:0,behavior:'smooth'})})}
function enterApp(id,trackLogin=true){activeAccountId=id;page='overview';localStorage.setItem('rostera-session',id);store=loadStore(id);const account=accounts[id];document.querySelector('#auth-screen').hidden=true;document.querySelector('#app-shell').hidden=false;document.querySelector('#bottomnav').hidden=false;document.querySelector('#profile-avatar').textContent=account.initials;document.querySelector('#account-menu').setAttribute('aria-label',`Аккаунт: ${account.name}`);document.querySelector('#account-menu').title=`${account.name} · ${account.login}`;switchingFrom=null;screenStartedAt=performance.now();if(trackLogin)event('login');render()}
function showLogin(returnAccount=null){switchingFrom=returnAccount;activeAccountId=null;localStorage.removeItem('rostera-session');document.querySelector('#app-shell').hidden=true;document.querySelector('#bottomnav').hidden=true;document.querySelector('#auth-screen').hidden=false;document.querySelector('#login-form').reset();document.querySelector('#login-error').hidden=true;document.querySelector('#login-cancel').hidden=!returnAccount;screenStartedAt=performance.now()}
document.querySelector('#login-form').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));const account=Object.values(accounts).find(a=>a.login.toLowerCase()===data.username.trim().toLowerCase()&&a.password===data.password);if(!account){document.querySelector('#login-error').hidden=false;return}enterApp(account.id,true)});
document.querySelector('#login-cancel').addEventListener('click',()=>{if(switchingFrom)enterApp(switchingFrom,false)});
document.querySelector('#account-menu').addEventListener('click',()=>{const account=accounts[activeAccountId];const body=document.querySelector('#account-dialog-body');body.innerHTML=`<div class="row"><h2>Аккаунт</h2><button type="button" class="btn outline small" id="close-account">×</button></div><p><strong>${esc(account.name)}</strong><br><span style="color:var(--muted)">${esc(account.login)}</span></p><div class="form" style="margin-top:18px"><button type="button" class="btn" id="switch-account">Сменить аккаунт</button><button type="button" class="btn outline" id="logout-account">Выйти из аккаунта</button></div>`;const dialog=document.querySelector('#account-dialog');dialog.showModal();document.querySelector('#close-account').onclick=()=>dialog.close();document.querySelector('#switch-account').onclick=()=>{event('account_switch');dialog.close();showLogin(activeAccountId)};document.querySelector('#logout-account').onclick=()=>{event('logout');dialog.close();showLogin()}});
document.querySelector('#home-link').addEventListener('click',e=>{e.preventDefault();go('overview');window.scrollTo({top:0,behavior:'smooth'})});
document.querySelector('#role').onchange=e=>{role=e.target.value;toast(t(role));render()};document.querySelector('#lang').onchange=e=>{lang=e.target.value;render()};if(activeAccountId)enterApp(activeAccountId,false);else showLogin();render();
</script><script src="features.js"></script></body></html>
